[project]
name = "kindle-dash-server"
version = "0.1.0"
description = "Dashboard image server for jailbroken Kindle (kindle-dash)"
readme = "README.md"
authors = [
    { name = "Laplusdestiny", email = "laplusdestiny@laplusdestiny.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
kindle-dash-server = "kindle_dash_server:main"
kindle-dash-snapshot = "kindle_dash_server:snapshot"
kindle-dash-push-claude = "kindle_dash_server.push:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
