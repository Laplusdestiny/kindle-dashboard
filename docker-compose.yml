services:
  kindle-dash:
    build: .
    container_name: kindle-dash
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: Asia/Tokyo
      # 天気を取得する地点（初期値は大阪市）
      LATITUDE: "34.6937"
      LONGITUDE: "135.5023"
      PLACE_NAME: "大阪"
      # Kindle Paperwhite 3（第7世代）の画面サイズ
      SCREEN_WIDTH: "1072"
      SCREEN_HEIGHT: "1448"
      # portrait（縦）または landscape（横）
      ORIENTATION: "portrait"
      # 横置きで上下が逆になる場合は 90 と 270 を入れ替える
      LANDSCAPE_ROTATE: "90"
      # 同じ画像を使い回す秒数（連続アクセス時の負荷軽減）
      CACHE_SECONDS: "60"
