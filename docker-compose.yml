services:
  kindle-dash:
    build: .
    container_name: kindle-dash
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 受け取った Claude の使用量を保存（再起動しても消えない）
      - ./data:/srv/data
    environment:
      TZ: Asia/Tokyo
      # 天気を取得する地点（初期値は大阪市）
      LATITUDE: "34.6937"
      LONGITUDE: "135.5023"
      PLACE_NAME: "大阪"
      # Kindle Paperwhite 3（第7世代）の画面サイズ
      SCREEN_WIDTH: "1072"
      SCREEN_HEIGHT: "1448"
      # portrait（縦）または landscape（横）
      ORIENTATION: "landscape"
      # 横長のデザインを回して、画面と同じ縦長PNG(1072x1448)で出力する（eips は画像を回転せずに描くため）。
      # 90 なら Kindle の下端（電源ボタン・USB）が左に来る向き。上下が逆なら 270。0 で横長PNGのまま
      LANDSCAPE_ROTATE: "90"
      # 同じ画像を使い回す秒数（連続アクセス時の負荷軽減）
      CACHE_SECONDS: "60"
      # Claude の使用量パネルを出すか（0 で非表示）
      SHOW_CLAUDE: "1"
      # 設定すると POST /claude-usage に同じ値のトークンが必要になる（PC側は --token か KINDLE_DASH_TOKEN）
      PUSH_TOKEN: ""
      # コンテナ内の Claude Code で使用量を取得する（claude setup-token で作ったトークン）。
      # 値はここに書かず、docker-compose.yml と同じ場所の .env に CLAUDE_CODE_OAUTH_TOKEN=... と書く
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      # 取得間隔（分）。0 で取得しない
      CLAUDE_POLL_MINUTES: "15"
