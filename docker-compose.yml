services:
  kindle-dash:
    build: .
    container_name: kindle-dash
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # 受け取った Claude の使用量と、取得した時刻表を保存（再起動しても消えない）
      - ./data:/srv/data
    # 設定はすべて .env に書く（雛形は .env.example）。
    # .env に無い項目はコード側の既定値になる
    env_file:
      - .env
